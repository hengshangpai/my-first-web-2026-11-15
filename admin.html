<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后台 · 内容管理</title>
  <style>
    :root {
      --bg: #f6f8f9;
      --card: #ffffff;
      --line: #e4e9ec;
      --text: #1b2026;
      --muted: #6b7680;
      --accent: #16a374;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.65; padding: 48px 20px 72px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
    .eyebrow {
      margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--accent);
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
    .back { font-size: 13px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 24px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 4px; font-size: 17px; }
    .hint { margin: 0 0 18px; font-size: 13px; color: var(--muted); }

    .alert { margin: 0 0 18px; padding: 12px 15px; border-radius: 10px; font-size: 13.5px; }
    .alert.error { background: #fff4ed; color: #9a3412; border: 1px solid #fbd9c4; }
    .alert.ok { background: #ecfdf5; color: #0f7a58; border: 1px solid #bbf0d8; }

    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: #46515b; }
    input, textarea {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
      color: var(--text); background: #fbfcfd; border: 1px solid var(--line);
      border-radius: 9px; transition: .15s ease;
    }
    input:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      background: #fff; box-shadow: 0 0 0 3px rgba(22, 163, 116, .14);
    }
    textarea { resize: vertical; min-height: 84px; }

    button {
      padding: 11px 16px; font-size: 14px; font-weight: 600; font-family: inherit;
      color: #fff; background: var(--accent); border: 0; border-radius: 9px; cursor: pointer;
      transition: .15s ease;
    }
    button:hover:not(:disabled) { background: #0f8a61; }
    button:disabled { background: #b9c2c9; cursor: not-allowed; }
    button.ghost {
      padding: 6px 12px; font-size: 12.5px; color: #5b6570;
      background: #f0f3f5; border: 1px solid var(--line);
    }
    button.ghost:hover:not(:disabled) { background: #e6ebee; color: var(--text); }

    .who {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
      font-size: 13px; color: var(--muted);
    }
    .who strong { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">Admin</p>
        <h1>内容管理</h1>
      </div>
      <a class="back" href="./index.html">← 返回首页</a>
    </header>

    <div id="alert" class="alert" hidden></div>

    <section id="login-panel" class="card">
      <h2>登录</h2>
      <p class="hint">使用 Supabase 里创建的邮箱账号登录。</p>
      <form id="login-form">
        <label>邮箱
          <input type="email" id="email" name="email" required autocomplete="username" placeholder="you@example.com" />
        </label>
        <label>密码
          <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="至少 6 位" />
        </label>
        <button type="submit" id="login-btn">登录</button>
      </form>
    </section>

    <section id="dashboard" class="card" hidden>
      <div class="who">
        <span>已登录：<strong id="user-email"></strong></span>
        <button type="button" id="logout-btn" class="ghost">退出登录</button>
      </div>

      <h2>添加时间线</h2>
      <p class="hint">保存后写入 timeline 表，随后自动跳回首页。</p>
      <form id="timeline-form">
        <label>日期
          <input type="date" id="date" name="date" required />
        </label>
        <label>标题
          <input type="text" id="title" name="title" required maxlength="120" placeholder="例如：完成个人主页第一版" />
        </label>
        <label>描述
          <textarea id="description" name="description" placeholder="可选，一两句话说明做了什么"></textarea>
        </label>
        <label>标签
          <input type="text" id="tags" name="tags" placeholder="用逗号分隔，例如：前端, Supabase" />
        </label>
        <button type="submit" id="save-btn">保存到 timeline</button>
      </form>
    </section>
  </main>

  <script src="./vendor/supabase.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
